<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - AcolhePet</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <header>
        <h1>Cadastro de apoiadores</h1>

        <nav class="navegacao">
            <input type="checkbox" id="menu-toggle" class="menu-toggle">
        
            <label for="menu-toggle" class="menu-hamburguer">
                ☰ Menu
            </label>
        
            <div class="menu-links">
                <a href="index.html">Início</a>
        
                <div class="dropdown">
                    <a href="projetos.html">Projetos</a>
        
                    <div class="submenu">
                        <a href="projetos.html">Resgate</a>
                        <a href="projetos.html">Doações</a>
                        <a href="projetos.html">Voluntariado</a>
                    </div>
                </div>
        
                <a href="cadastro.html">Cadastro</a>
            </div>
        </nav>
    </header>

    <main>

        <form id="form-cadastro">

            <fieldset>
                <legend>Dados pessoais</legend>

                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" required>

                <br><br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <br><br>

                <label for="nascimento">Data de nascimento:</label>
                <input type="date" id="nascimento" name="nascimento">

                <br><br>

                <label for="cpf">CPF:</label>
                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                    placeholder="000.000.000-00"
                    required
                >

                <br><br>

                <label for="telefone">Telefone:</label>
                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                    placeholder="(00) 00000-0000"
                    required
                >
            </fieldset>

            <br>

            <fieldset>
                <legend>Endereço</legend>

                <label for="cep">CEP:</label>
                <input
                    type="text"
                    id="cep"
                    name="cep"
                    pattern="[0-9]{5}-[0-9]{3}"
                    placeholder="00000-000"
                    required
                >

                <br><br>

                <label for="endereco">Endereço:</label>
                <input type="text" id="endereco" name="endereco" required>

                <br><br>

                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade" required>

                <br><br>

                <label for="estado">Estado:</label>
                <input type="text" id="estado" name="estado" required>
            </fieldset>

            <br>

            <fieldset>
                <legend>Forma de participação</legend>

                <label for="participacao">Como deseja ajudar?</label>

                <select id="participacao" name="participacao" required>
                    <option value="">Selecione</option>
                    <option value="doador">Doador</option>
                    <option value="voluntario">Voluntário</option>
                </select>
            </fieldset>

            <br>

            <button type="submit">Enviar cadastro</button>

        </form>

    </main>

    <footer>
        <p>AcolhePet — Proteção e cuidado animal</p>
    </footer>

<script src="../js/main.js"></script>

</body>

</html>
